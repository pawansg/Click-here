<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Click Here</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ff9a8b, #ff6a88, #ff99ac);
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 20px;
  }
  .card {
    background: white;
    border-radius: 20px;
    padding: 40px 30px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
  }
  h1 {
    font-size: 22px;
    color: #333;
    margin-bottom: 25px;
  }
  button {
    font-size: 17px;
    padding: 14px 28px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    margin: 8px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    font-weight: 600;
  }
  button:hover {
    transform: translateY(-2px) scale(1.03);
  }
  .btn-main {
    background: #ff6a88;
    color: white;
    box-shadow: 0 8px 20px rgba(255,106,136,0.4);
  }
  .btn-yes {
    background: #4caf50;
    color: white;
    box-shadow: 0 8px 20px rgba(76,175,80,0.4);
  }
  .btn-no {
    background: #999;
    color: white;
    box-shadow: 0 8px 20px rgba(153,153,153,0.4);
  }
  .result {
    margin-top: 20px;
    font-size: 18px;
    font-weight: 600;
    color: #333;
    min-height: 24px;
  }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <div id="step1">
      <h1>👀</h1>
      <button class="btn-main" onclick="showStep2()">Click here to find out</button>
    </div>

    <div id="step2" class="hidden">
      <h1>Do you have money? 💰</h1>
      <button class="btn-yes" onclick="showResult(true)">Yes</button>
      <button class="btn-no" onclick="showResult(false)">No</button>
    </div>

    <div id="step3" class="hidden">
      <div class="result" id="resultText"></div>
    </div>
  </div>

<script>
function showStep2() {
  document.getElementById('step1').classList.add('hidden');
  document.getElementById('step2').classList.remove('hidden');
}
function showResult(hasMoney) {
  document.getElementById('step2').classList.add('hidden');
  document.getElementById('step3').classList.remove('hidden');
  document.getElementById('resultText').textContent = hasMoney
    ? "Then I will go on a date with you! 💕"
    : "Sorry, try next time with some money 😅";
}
</script>
</body>
</html>
